app = "a3-clausedesk"
primary_region = "ord"

[build]
  dockerfile = "Dockerfile"

[env]
  APP_HOST = "a3-clausedesk.fly.dev"
  PUBLIC_DEMO = "true"
  RAILS_MAX_THREADS = "3"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = false
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "30s"
    method = "GET"
    path = "/up"
    [http_service.checks.headers]
      Host = "a3-clausedesk.fly.dev"
      X-Forwarded-Proto = "https"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"
